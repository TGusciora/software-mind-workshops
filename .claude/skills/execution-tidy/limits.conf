# execution-tidy limits
#
# Format: one `key = value` per line. `#` starts a comment line.
# This file is parsed, never executed.
#
# Sizes are measured on REVIEWABLE files only (after the excludes and the
# code_ext filter below), and count added + deleted lines.

# Branch, tag or commit the change is compared against (via merge-base).
# `--base` on the command line overrides it.
base_ref = main

# A change over any of these limits is too big to review in one pass.
max_files = 15
max_total_lines = 400
max_file_lines = 250

# Only files with these extensions count as code (case-insensitive,
# space-separated, repeatable). Everything else - markdown, JSON, images,
# lockfiles, YAML - is reported as "non-code" and ignored.
code_ext = js jsx mjs cjs ts tsx
code_ext = py sh bash zsh
code_ext = html css scss sql
code_ext = java kt go rs rb php c h cpp cs swift

# Globs for files that are never reviewed, even when their extension is code.
# One per line, repeatable. Each is matched against the repo-relative path
# with a leading "/", and `*` also matches "/". So `*/test/*` matches a
# test/ folder at any depth and `/docs/*` only matches docs/ at the root.

# tests and test support
exclude = */test/*
exclude = */tests/*
exclude = */__tests__/*
exclude = */__mocks__/*
exclude = */fixtures/*
exclude = *.test.*
exclude = *.spec.*
exclude = *_test.*
exclude = */test_*
exclude = */conftest.py
exclude = */setupTests.*

# generated, vendored and build output
exclude = */node_modules/*
exclude = */dist/*
exclude = */build/*
exclude = */coverage/*
exclude = */vendor/*
exclude = */__pycache__/*
exclude = *.min.*
exclude = *.snap

# skill evaluation scratch space
exclude = *-workspace/*
