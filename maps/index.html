<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a Pizza Restaurant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf8f3;color:#1f1b16;font:15px/1.45 system-ui,-apple-system,sans-serif}
header{padding:16px}
h1{margin:0 0 4px;font-size:1.4rem}
header p{margin:0;color:#6b635a}
#map{height:calc(100vh - 110px);min-height:420px;margin:0 16px 16px;border:1px solid #e6dfd4;border-radius:10px}
.map-empty{margin:0 16px 16px;padding:24px;border:1px solid #e6dfd4;border-radius:10px;background:#fff;text-align:center}
.store-pin{display:flex;align-items:center;justify-content:center;background:none;border:0}
.store-pin__dot{width:20px;height:20px;border-radius:50%;background:#1f8a4c;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
</style>
</head>
<body>
<header>
<h1>Find a pizza restaurant near you</h1>
<p>Every pin is a restaurant that's open for business.</p>
</header>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
